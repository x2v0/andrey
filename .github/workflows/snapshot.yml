name: Snapshot Hydrated HTML
on:
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install playwright
          python -m playwright install chromium --with-deps
      - name: Run server and capture
        run: |
          python server.py &
          sleep 3
          python capture.py
      - name: Replace and push
        run: |
          mv index_hydrated.html index.html
          rm capture.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "snapshot: replace SSR with hydrated HTML" || echo no-changes
          git push
